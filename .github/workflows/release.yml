name: Release Windows app

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Build and test versioned package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIMPLE_KEYMAP_TEST_CLIPBOARD: '1'
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ((Get-Content -LiteralPath VERSION -Raw).Trim() -ne $version) { throw 'Release tag does not match VERSION.' }
          ./build.ps1 -Version $env:RELEASE_TAG
      - name: Verify embedded version and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $archive = "dist/SimpleKeymap-v$version-windows-x64.zip"
          $expected = ((Get-Content ($archive + '.sha256') -Raw) -split ' ')[0]
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) { throw 'Checksum mismatch.' }
          # Stable asset name lets the website follow the latest version without edits.
          Copy-Item -LiteralPath $archive -Destination 'dist/SimpleKeymap-windows-latest.zip'
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/SimpleKeymap-windows-latest.zip.sha256'), ($expected + "  SimpleKeymap-windows-latest.zip`n"), [System.Text.Encoding]::ASCII)
      - name: Package corresponding source from the release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $source = "dist/SimpleKeymap-v$version-source.zip"
          git archive --format=zip --prefix="SimpleKeymap-v$version/" --output=$source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD ($source + '.sha256')), ($hash + '  ' + [System.IO.Path]::GetFileName($source) + "`n"), [System.Text.Encoding]::ASCII)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $source))
          try {
            foreach ($file in @('LICENSE', 'NOTICE', 'TRADEMARKS.md', 'README.md', 'build.ps1', 'go.mod', 'main_windows.go', 'information_windows.go', 'scripts/verify-package.ps1')) {
              if (!$zip.GetEntry("SimpleKeymap-v$version/$file")) { throw "Source package missing $file" }
            }
          } finally { $zip.Dispose() }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $archive = "dist/SimpleKeymap-v$version-windows-x64.zip"
          $source = "dist/SimpleKeymap-v$version-source.zip"
          gh release create $env:RELEASE_TAG $archive ($archive + '.sha256') $source ($source + '.sha256') 'dist/SimpleKeymap-windows-latest.zip' 'dist/SimpleKeymap-windows-latest.zip.sha256' --verify-tag --title "轻映 $env:RELEASE_TAG" --notes-file ".github/release-notes/$($env:RELEASE_TAG).md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
