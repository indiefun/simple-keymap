name: Check app and website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Test Windows app
        shell: pwsh
        env:
          SIMPLE_KEYMAP_TEST_CLIPBOARD: '1'
        run: |
          ./build.ps1 -TestOnly
          $env:SIMPLE_KEYMAP_TEST_DPI = '144'
          go test -timeout 30s -run TestNativeRuleAndCaptureFlow -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'High DPI interface checks failed.' }
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run site:check
      - run: npm run site:test
